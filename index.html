<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificación de Certificado</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .contenedor {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            padding: 40px 25px;
            box-sizing: border-box;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 32px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 35px;
        }

        .titulo h2 {
            margin-bottom: 10px;
        }

        .valido {
            display: inline-block;
            background: #2e9d50;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
        }

        .datos {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
        }

        .dato {
            margin-bottom: 20px;
        }

        .dato strong {
            display: block;
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }

        .dato span {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="logo">
            <h1>ESCUELA EXTERIOR</h1>
        </div>

        <div class="titulo">
            <h2>VERIFICACIÓN DE CERTIFICADO</h2>
            <div class="valido">
                ✓ CERTIFICADO VÁLIDO
            </div>
        </div>

        <div class="datos">

            <div class="dato">
                <strong>ALUMNO</strong>
                <span>Nombre del alumno</span>
            </div>

            <div class="dato">
                <strong>CERTIFICADO EN</strong>
                <span>Nombre del curso</span>
            </div>

            <div class="dato">
                <strong>CÓDIGO DE VERIFICACIÓN</strong>
                <span>CE-000001</span>
            </div>

            <div class="dato">
                <strong>FECHA DE EMISIÓN</strong>
                <span>26 de agosto de 2026</span>
            </div>

            <div class="dato">
                <strong>ESTADO</strong>
                <span>VIGENTE</span>
            </div>

        </div>

    </div>

</body>
</html>
